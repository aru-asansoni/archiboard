version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: archiboard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/archiboard123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "archiboard123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archiboard-backend
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Neo4j__Uri=bolt://neo4j:7687
      - Neo4j__Username=neo4j
      - Neo4j__Password=archiboard123
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend-publish:/app/publish

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archiboard-frontend
    ports:
      - "4200:80"
    environment:
      - API_URL=http://backend:8080
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  seeder:
    build:
      context: ./tools/seeder
      dockerfile: Dockerfile
    container_name: archiboard-seeder
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=archiboard123
    depends_on:
      neo4j:
        condition: service_healthy
    profiles:
      - seeder

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  backend-publish:

